{% extends 'base.html' %}
{% block title %}Agregar Actividad{% endblock %}
{% block content %}
<h2>Agregar Nueva Actividad</h2>
{% if errors %}
  <ul style="color:red;">
    {% for error in errors %}<li>{{ error }}</li>{% endfor %}
  </ul>
{% endif %}
<form id="formulario" method="post" enctype="multipart/form-data">
  <section>
    <h3>¿Dónde?</h3>
    <label>Región:
      <select id="region" name="region">
        <option value="">Seleccione</option>
        {% for region in regiones %}
        <option value="{{ region.id }}" {% if region.id == selected_region %}selected{% endif %}>{{ region.nombre }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Comuna:
      <select id="comuna" name="comuna">
        <option value="">Seleccione</option>
        {% for comuna in comunas %}
        <option value="{{ comuna.id }}" {% if comuna.id == selected_comuna %}selected{% endif %}>{{ comuna.nombre }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Sector:
      <input type="text" id="sector" name="sector" maxlength="100" value="{{ request.form.get('sector', '') }}" />
    </label>
  </section>
  <section>
    <h3>¿Quién organiza?</h3>
    <label>Nombre:
      <input type="text" id="nombre" name="nombre" maxlength="200" value="{{ request.form.get('nombre', '') }}" />
    </label>
    <label>Email:
      <input type="email" id="email" name="email" maxlength="100" value="{{ request.form.get('email', '') }}" />
    </label>
    <label>Número de celular:
      <input type="tel" id="celular" name="celular" placeholder="+569.12345678" value="{{ request.form.get('celular', '') }}" />
    </label>
    <div id="contactos">
      <!-- JS will handle dynamic contact fields -->
      <label>Contactar por:
        <select class="contactar-por" name="contactar_por[]">
          <option value="">Seleccione</option>
          <option value="whatsapp">WhatsApp</option>
          <option value="telegram">Telegram</option>
          <option value="x">X</option>
          <option value="instagram">Instagram</option>
          <option value="tiktok">TikTok</option>
          <option value="otra">Otra</option>
        </select>
        <input type="text" class="contacto-id" name="contacto_id[]" style="display: none" minlength="4" maxlength="50" />
      </label>
    </div>
    <button type="button" id="agregar-contacto">Agregar otro medio de contacto</button>
  </section>
  <section>
    <h3>Información de la actividad</h3>
    <label>Día hora inicio:
      <input type="datetime-local" id="inicio" name="inicio" value="{{ request.form.get('inicio', '') }}" />
    </label>
    <label>Día hora término:
      <input type="datetime-local" id="termino" name="termino" value="{{ request.form.get('termino', '') }}" />
    </label>
    <label>Descripción:
      <textarea id="descripcion" name="descripcion" cols="50" rows="10">{{ request.form.get('descripcion', '') }}</textarea>
    </label>
    <label>Tema:
      <select id="tema" name="tema">
        <option value="">Seleccione</option>
        <option value="música">Música</option>
        <option value="deporte">Deporte</option>
        <option value="ciencias">Ciencias</option>
        <option value="religión">Religión</option>
        <option value="política">Política</option>
        <option value="tecnología">Tecnología</option>
        <option value="juegos">Juegos</option>
        <option value="baile">Baile</option>
        <option value="comida">Comida</option>
        <option value="otro">Otro</option>
      </select>
      <input type="text" id="tema-otro" name="tema_otro" style="display: none" minlength="3" maxlength="15" />
    </label>
    <div id="fotos">
      <label>Foto: <input type="file" class="foto-input" name="fotos" multiple /></label>
    </div>
    <button type="button" id="agregar-foto">Agregar otra foto</button>
    <button type="submit">Agregar esta actividad</button>
  </section>
</form>
<script src="{{ url_for('static', filename='script.js') }}"></script>
{% endblock %}
