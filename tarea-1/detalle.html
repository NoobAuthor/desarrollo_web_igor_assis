<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalle de Actividad</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Detalle de Actividad</h1>
      <nav>
        <a href="listado.html">Volver al Listado</a> |
        <a href="index.html">Volver a la Portada</a>
      </nav>
    </header>
    <main id="detalle"></main>
    <div
      id="modal"
      style="
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
      "
    >
      <img
        id="modal-img"
        style="display: block; margin: 50px auto; width: 800px; height: 600px"
      />
      <button onclick="document.getElementById('modal').style.display='none'">
        Cerrar
      </button>
    </div>
    <script src="data.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const id = new URLSearchParams(window.location.search).get("id");
        const a = actividades[id];
        document.getElementById("detalle").innerHTML = `
                <p><strong>Inicio:</strong> ${a.inicio.replace("T", " ")}</p>
                <p><strong>Término:</strong> ${a.termino ? a.termino.replace("T", " ") : "-"}</p>
                <p><strong>Región:</strong> ${a.region}</p>
                <p><strong>Comuna:</strong> ${a.comuna}</p>
                <p><strong>Sector:</strong> ${a.sector || "-"}</p>
                <p><strong>Tema:</strong> ${a.tema}</p>
                <p><strong>Organizador:</strong> ${a.organizador}</p>
                <p><strong>Email:</strong> ${a.email}</p>
                <p><strong>Celular:</strong> ${a.celular || "-"}</p>
                <p><strong>Contactos:</strong> ${a.contacto.tipo ? `${a.contacto.tipo}: ${a.contacto.id}` : "-"}</p>
                <p><strong>Descripción:</strong> ${a.descripcion || "-"}</p>
                <p><strong>Fotos:</strong></p>
                ${a.fotos.map((f) => `<img src="fotos/${f}" width="320" height="240" style="cursor:pointer;" onclick="document.getElementById('modal-img').src='fotos/${f}';document.getElementById('modal').style.display='block';">`).join("")}
            `;
      });
    </script>
  </body>
</html>
